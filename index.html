<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpaceCloudNet</title>
<meta name="description" content="SpaceCloudNet — 官方网站建设中。Our website is under construction.">
<link rel="canonical" href="https://spacecloudnet.com/">
<meta name="theme-color" content="#070b16">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SpaceCloudNet">
<meta property="og:title" content="SpaceCloudNet">
<meta property="og:description" content="官方网站建设中 · Our website is under construction.">
<meta property="og:url" content="https://spacecloudnet.com/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#070b16; --fg:#e8eefc; --muted:#93a3c4; --line:#1f2b47;
  --accent:#4f8cff; --accent2:#22d3ee; --card:rgba(255,255,255,.04);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f6f8fd; --fg:#0d1526; --muted:#5a6b8c; --line:#dbe3f2; --card:rgba(255,255,255,.75); }
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; min-height:100svh; background:var(--bg); color:var(--fg);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:72px 20px 40px; text-align:center; -webkit-font-smoothing:antialiased;
}
.glow{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(600px 300px at 50% 6%,rgba(79,140,255,.20),transparent 70%),
             radial-gradient(520px 280px at 82% 92%,rgba(34,211,238,.13),transparent 70%);}
.topbar{position:fixed;top:0;right:0;padding:16px 18px}
.lang{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
.lang:hover{border-color:var(--accent)}
a{color:var(--accent)}
.lang:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{position:relative;max-width:640px}
.mark{width:76px;height:76px;margin-bottom:22px}
h1{font-size:clamp(28px,6vw,44px);margin:0 0 12px;letter-spacing:-.02em;
  background:linear-gradient(100deg,var(--fg),var(--accent) 62%,var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0 0 26px;color:var(--muted);font-size:clamp(15px,2.4vw,17px)}
.contact{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;margin:0}
.btn{display:inline-block;padding:10px 22px;border-radius:999px;text-decoration:none;color:#fff;
  background:linear-gradient(100deg,var(--accent),var(--accent2));font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.08)}
.addr{color:var(--muted);font-size:14px}
footer{position:relative;margin-top:56px;color:var(--muted);font-size:12.5px;
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sep{opacity:.5}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:16px;background:var(--card);padding:8px 12px;border-radius:8px}
</style>
</head>
<body>
<a class="skip" href="#main">跳到主要内容</a>
<div class="glow" aria-hidden="true"></div>
<header class="topbar">
  <button id="lang" class="lang" type="button" aria-label="Switch to English">EN</button>
</header>
<main id="main">
  <img class="mark" src="favicon.svg" alt="SpaceCloudNet" width="76" height="76">
  <h1>SpaceCloudNet</h1>
  <p class="lead" data-zh="官方网站正在建设中，敬请期待。" data-en="Our website is under construction. Stay tuned.">官方网站正在建设中，敬请期待。</p>
  <p class="contact">
    <a class="btn" href="mailto:moozaa75@163.com" data-zh="联系我们" data-en="Contact us">联系我们</a>
    <span class="addr">moozaa75@163.com</span>
  </p>
</main>
<footer>
  <span>© <span id="y">2026</span> SpaceCloudNet</span>
  <span class="sep">·</span>
  <span>spacecloudnet.com</span>
  <span class="sep">·</span>
  <span>spacecloudnet.cn</span>
</footer>
<script>
(function () {
  var KEY = 'scn-lang', btn = document.getElementById('lang');
  function apply(lang) {
    var en = lang === 'en';
    document.documentElement.lang = en ? 'en' : 'zh-CN';
    document.querySelectorAll('[data-zh]').forEach(function (el) {
      var t = el.getAttribute(en ? 'data-en' : 'data-zh');
      if (t) el.textContent = t;
    });
    btn.textContent = en ? '中文' : 'EN';
    btn.setAttribute('aria-label', en ? '切换到中文' : 'Switch to English');
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  apply(saved === 'en' || saved === 'zh' ? saved
        : ((navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en'));
  btn.addEventListener('click', function () {
    var next = document.documentElement.lang === 'en' ? 'zh' : 'en';
    apply(next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
  });
  document.getElementById('y').textContent = String(new Date().getFullYear());
})();
</script>
</body>
</html>
